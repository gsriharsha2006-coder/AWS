version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun
        - bun install --frozen-lockfile
        # Vite embeds the VITE_* values in browser code. The server bundle
        # also needs the same public Supabase settings at request time.
        - |
          cat > .env <<EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID
          SUPABASE_URL=$VITE_SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          EOF
        - >-
          node -e "const required=['VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY'];const
          missing=required.filter((name)=>!process.env[name]);if(missing.length){console.error('Missing
          required Amplify environment variables: '+missing.join(', '));process.exit(1)}console.log('Amplify
          authentication environment check passed.')"
    build:
      commands:
        - NITRO_PRESET=aws_amplify bun run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*