
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun
        - bun install --frozen-lockfile
    build:
      commands:
        - NITRO_PRESET=aws_amplify bun run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*